name: Build Paisa Floww APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Optional: only runs if you added the private secrets (see README). Forks never get your secrets.
      - name: Prepare personal signing key (optional)
        env:
          KS_B64: ${{ secrets.PAISA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > app/personal.jks; echo "Using personal signing key"; else echo "No personal key - using default debug key"; fi

      - name: Build debug APK
        env:
          PAISA_KS_PASS: ${{ secrets.PAISA_KS_PASS }}
          PAISA_KEY_ALIAS: ${{ secrets.PAISA_KEY_ALIAS }}
          PAISA_KEY_PASS: ${{ secrets.PAISA_KEY_PASS }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PaisaFloww-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest

      # Pushing a tag like v1.0.0 publishes the APK as a public download on the Releases page.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PaisaFloww.apk
          gh release create "$GITHUB_REF_NAME" PaisaFloww.apk --title "Paisa Floww $GITHUB_REF_NAME" --generate-notes || gh release upload "$GITHUB_REF_NAME" PaisaFloww.apk --clobber
